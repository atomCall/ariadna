<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Ariadna convierte un mapa mental en un mazo de tarjetas con repaso espaciado. El mapa es el mazo."
    />
    <meta name="theme-color" content="#f6f3ec" />
    <title>ariadna</title>
    <script>
      try {
        const saved = localStorage.getItem('ariadna-theme')
        const dark =
          saved === 'dark' ||
          (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        if (dark) {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#1e1e1e')
        }
      } catch {
        // Si localStorage falla, se queda el tema claro.
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
